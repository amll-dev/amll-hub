<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
<style>
  body { margin:0; padding:0; background:#f5f5f7; }
  .wrap { width:100%; max-width:560px; margin:0 auto; padding:28px 16px; }
  .card { background:#ffffff; border:1px solid #e5e5ea; border-radius:12px; padding:28px; }
  .brand { font-size:13px; color:#8e8e93; letter-spacing:.04em; }
  .h1 { margin:14px 0 8px; font-size:20px; line-height:28px; color:#1c1c1e; }
  .lead { margin:0 0 18px; font-size:15px; line-height:24px; color:#3a3a3c; }
  .song { margin:0 0 4px; font-size:18px; font-weight:600; color:#1c1c1e; }
  .artist { margin:0 0 18px; font-size:14px; color:#8e8e93; }
  .tip { margin:18px 0 0; font-size:13px; line-height:22px; color:#8e8e93; }
  .btn { display:inline-block; margin-top:20px; padding:11px 20px; border-radius:8px; background:#ff6673; color:#ffffff; font-size:14px; font-weight:600; text-decoration:none; }
  .foot { margin-top:22px; padding-top:16px; border-top:1px solid #e5e5ea; font-size:12px; line-height:20px; color:#8e8e93; }
  a { color:#ff6673; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      {{if .LogoURL}}<img src="{{.LogoURL}}" alt="AMLL Hub" width="28" height="28" style="display:inline-block;vertical-align:middle;border-radius:6px;margin-right:8px;">{{end}}
      <span style="display:inline-block;vertical-align:middle;">AMLL Hub · 歌词请愿</span>
    </div>
    <h1 class="h1">{{.Headline}}</h1>
    <p class="lead">{{.DisplayName}}，你好！{{.Preheader}}</p>

    <p class="song">{{.SongName}}</p>
    {{if .Artist}}<p class="artist">{{.Artist}}</p>{{end}}
    <p class="lead">{{.Lead}}</p>

    {{if .Tip}}<p class="tip">{{.Tip}}</p>{{end}}
    {{if .DetailURL}}<a class="btn" href="{{.DetailURL}}">查看请愿</a>{{end}}

    <div class="foot">
      本邮件由 AMLL Hub 系统自动发送，请勿直接回复。<br>
      <a href="{{.SiteURL}}">{{.SiteURL}}</a> · © {{.Year}} AMLL Hub
    </div>
  </div>
</div>
</body>
</html>
