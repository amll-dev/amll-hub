name: Android 构建

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK 17（AGP 9 要求 17+）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（自带依赖缓存）
        uses: gradle/actions/setup-gradle@v5

      # AGP 9.4 需要 Build Tools 36.x，显式安装避免 runner 镜像版本漂移
      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 校验 Gradle 配置
        run: ./gradlew help --no-daemon --stacktrace

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: amll-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
