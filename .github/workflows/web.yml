name: 前端构建

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/web.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式检查
        run: npx prettier --check src

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build
