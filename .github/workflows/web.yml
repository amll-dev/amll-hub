name: 前端构建

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/web.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm run lint

      - name: Prettier 格式检查
        run: npx prettier --check src

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
