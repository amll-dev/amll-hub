name: 后端构建

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/go.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            artifact_name: server-linux-amd64
            binary: server
          - goos: linux
            goarch: arm64
            artifact_name: server-linux-arm64
            binary: server
          # Windows
          - goos: windows
            goarch: amd64
            artifact_name: server-windows-amd64
            binary: server.exe
          - goos: windows
            goarch: arm64
            artifact_name: server-windows-arm64
            binary: server.exe
          # macOS
          - goos: darwin
            goarch: amd64
            artifact_name: server-macos-amd64
            binary: server
          - goos: darwin
            goarch: arm64
            artifact_name: server-macos-arm64
            binary: server

    steps:
      - uses: actions/checkout@v7

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 构建 (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/server

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: backend/${{ matrix.binary }}
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 静态检查
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: 测试
        run: go test -v ./...

