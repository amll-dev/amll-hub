# Gradle JVM：AGP 9 编译较重，给足堆内存
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 并行与构建缓存
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# 关闭 AGP 9 的内置 Kotlin：KSP（含 Hilt 处理器）不兼容内置 Kotlin，
# 必须改用 kotlin("android") 插件。详见 KspGradleSubplugin 的报错提示。
android.builtInKotlin=false

# 唯一包名检查（AGP 9 默认 true）
android.uniquePackageNames=true
# R 类在编译期生成（AGP 9 默认 true）
android.enableAppCompileTimeRClass=true
